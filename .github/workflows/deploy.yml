name: Build & Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies and build Web
        run: |
          flutter pub get
          flutter build web --release
          cp vercel.json build/web/


      - name: Deploy to Vercel Production
        run: |
          mkdir -p build/web/.vercel
          echo "{\"projectId\":\"${{ secrets.VERCEL_PROJECT_ID }}\",\"orgId\":\"${{ secrets.VERCEL_ORG_ID }}\"}" > build/web/.vercel/project.json
          npx --yes vercel deploy build/web --prod --token=${{ secrets.VERCEL_TOKEN }} --yes

