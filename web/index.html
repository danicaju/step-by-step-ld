<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="STEP-BY-STEP LD: calculadora científica con resolución paso a paso e IA pedagógica.">
  <meta name="theme-color" content="#121418">

  <!-- iOS meta tags & icons (PWA Safari 'Añadir a pantalla de inicio') -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="STEP LD">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>STEP-BY-STEP LD</title>
  <style>
    /* Sin bordes blancos arriba/abajo en movil: el color lo sincroniza el tema de hardware. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #121418;
      overscroll-behavior: none;
    }
  </style>
  <script>
    // Arranque sin flash: aplica el fondo exterior del tema guardado (SharedPreferences web guarda
    // "flutter.selected_hardware_theme" como JSON) antes de cargar Flutter. Los colores reflejan
    // outerBg de lib/presentation/theme/calculator_themes.dart.
    (function () {
      var colors = { "default": "#121418", rosa: "#D986A4", arena: "#C4B8A3", menta: "#739984", perla: "#CFD4DE" };
      var color = colors["default"];
      try {
        var raw = window.localStorage.getItem("flutter.selected_hardware_theme");
        if (raw) {
          var id = raw;
          try { id = JSON.parse(raw); } catch (e) {}
          if (typeof id === "string" && colors.hasOwnProperty(id)) color = colors[id];
        }
      } catch (e) {}
      document.documentElement.style.backgroundColor = color;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", color);
      document.addEventListener("DOMContentLoaded", function () {
        document.body.style.backgroundColor = color;
      });
    })();
  </script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
